<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mustafa PS4 JB</title>
    <link rel="stylesheet" href="includes/style.css">
</head>
<body>
    <div class="container">
        <header class="site-header">
            <div class="header-content">
                <h1 class="main-title">
                    <span class="m-1">M</span><span class="m-2">u</span><span class="m-3">s</span><span class="m-4">t</span><span class="m-5">a</span><span class="m-6">f</span><span class="m-7">a</span>
                    <span class="p-1">P</span><span class="p-2">S</span><span class="p-3">4</span>
                    <span class="q-1">J</span><span class="q-2">B</span>
                </h1>
                <div class="subtitle">Jailbreak Host</div>
                <div class="version-badge">v3.0</div>
            </div>
        </header>

        <h3 id="UA">Running on: <span id="firmware-display">PS4</span></h3>
        <hr>

        <div class="btn-container">
            <form id="kernel-options">
                <label>Kernel:</label>
                <div class="radio-option">
                    <input type="radio" name="kernel" id="netctrl-exploit" value="netctrl">
                    <label for="netctrl-exploit">NetCtrl</label>
                </div>
                <div class="radio-option">
                    <input type="radio" name="kernel" id="lapse-exploit" value="lapse">
                    <label for="lapse-exploit">Lapse</label>
                </div>
            </form>
            <button id="jeilbrek">Jailbreak</button>
            <div class="autoJb">
                <label for="autoJbInput" id="autoJbLabel">Auto Jailbreak</label>
                <input class="mt-2" id="autoJbInput" type="checkbox">
            </div>
        </div>

        <pre id="console">Ready. Awaiting execution...</pre>

        <footer>
            <p class="credit">Designed by <a href="#" class="credit-link">Mustafa</a></p>
            <p class="thanks">Special thanks to all scene developers</p>
        </footer>
    </div>

    <script src="src/main.js"></script>
    <script src="includes/script.js"></script>
</body>
</html>
