<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mustafa PS4 JB - Lapse</title>
    <link rel="stylesheet" href="includes/style.css">
</head>
<body>
    <div class="container">
        <header class="site-header">
            <div class="header-content">
                <h1 class="main-title">
                    <span class="m-1">M</span><span class="m-2">u</span><span class="m-3">s</span><span class="m-4">t</span><span class="m-5">a</span><span class="m-6">f</span><span class="m-7">a</span>
                    <span class="p-1">P</span><span class="p-2">S</span><span class="p-3">4</span>
                    <span class="q-1">J</span><span class="q-2">B</span>
                </h1>
                <div class="subtitle">Jailbreak Host</div>
                <div class="version-badge">LAPSE CHAIN</div>
            </div>
        </header>

        <h3 id="UA">Lapse Chain</h3>
        <hr>

        <div class="btn-container">
            <div id="state" class="loading">⏳ Loading lapse chain...</div>
            <pre id="out"></pre>
        </div>

        <footer>
            <p class="credit">Designed by <a href="#" class="credit-link">Mustafa</a></p>
            <p class="thanks">Special thanks to all scene developers</p>
        </footer>

        <script type="module">
            import("./chain_lapse.js").catch(function(e) {
                var stateEl = document.getElementById("state");
                stateEl.innerHTML = "❌ Failed!";
                stateEl.className = "error";
            });
        </script>
    </div>
</body>
</html>
